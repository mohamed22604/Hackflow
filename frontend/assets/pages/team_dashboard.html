<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>HackFlow - Team</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #111;
        }

        .container {
            max-width: 900px;
            margin: 60px auto;
            padding: 20px;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
        }

        .header h1 {
            margin: 0 0 8px;
        }

        .header p {
            margin: 0;
            color: #666;
        }

        .members {
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        .members h2 {
            margin-top: 0;
        }

        .member {
            display: flex;
            justify-content: space-between;
            align-items: center;

            padding: 15px;
            margin-bottom: 10px;

            border: 1px solid #ddd;
            border-radius: 8px;
        }

        .member:last-child {
            margin-bottom: 0;
        }

        .member-name {
            font-weight: bold;
        }

        .role {
            font-size: 13px;
            color: #666;
        }

        .empty {
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="header">
            <h1 id="teamName">Loading...</h1>
            <p>Your Team</p>
        </div>

        <div class="members">

            <h2>Members</h2>

            <div id="membersList">
                <p class="empty">Loading members...</p>
            </div>

        </div>

    </div>


    <script>

        const teamId = localStorage.getItem("team_id");

        if (!teamId) {
            window.location.href = "/";
        }


        async function loadTeam() {

            try {

                const response = await fetch(`/teams/${teamId}`);

                if (!response.ok) {
                    throw new Error("Failed to load team");
                }

                const data = await response.json();

                document.getElementById("teamName").textContent =
                    data.name;


                const membersList =
                    document.getElementById("membersList");

                membersList.innerHTML = "";


                data.members.forEach(member => {

                    const memberElement =
                        document.createElement("div");

                    memberElement.className = "member";

                    memberElement.innerHTML = `
                        <div>
                            <div class="member-name">
                                ${member.name}
                            </div>

                            <div class="role">
                                ${member.role}
                            </div>
                        </div>
                    `;

                    membersList.appendChild(memberElement);

                });

            } catch (error) {

                console.error(error);

                document.getElementById("membersList").innerHTML =
                    `<p class="empty">Unable to load team.</p>`;

            }

        }


        loadTeam();

    </script>

</body>
</html>
